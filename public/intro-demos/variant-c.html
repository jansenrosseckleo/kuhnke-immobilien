<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuhnke Immobilien — Intro Konzept C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fffffe;
    --ink: #1a1a1c;
    --gold: #b08d57;
    --muted: #f4f2ee;
    --grid-line: #dedbd4;
    --ease-out-strong: cubic-bezier(0.22,1,0.36,1);
    --ease-in-out-strong: cubic-bezier(0.7,0,0.2,1);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Montserrat', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------------------------------- */
  /* MOCK PAGE BEHIND THE INTRO         */
  /* ---------------------------------- */

  .site{
    min-height: 100vh;
    background: var(--bg);
  }

  .site-header{
    height: 76px;
    display:flex;
    align-items:center;
    padding: 0 32px;
    border-bottom: 1px solid var(--muted);
    position: sticky;
    top:0;
    background: var(--bg);
    z-index: 10;
  }

  .brand-lockup{
    display:flex;
    align-items:center;
    gap: 14px;
  }

  #header-logo-slot{
    width: 36px;
    height: 48px;
    position: relative;
    flex-shrink:0;
  }

  #header-logo-slot svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity: 0;
  }

  .wordmark{
    font-family: 'Lora', serif;
    font-size: 19px;
    letter-spacing: 0.01em;
    color: var(--ink);
    white-space: nowrap;
  }

  .site-hero{
    padding: 15vh 32px 20vh;
    max-width: 920px;
  }

  .hero-eyebrow{
    font-family:'Montserrat', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--gold);
    margin: 0 0 18px;
  }

  .hero-headline{
    font-family: 'Lora', serif;
    font-weight: 500;
    font-size: clamp(34px, 5.6vw, 64px);
    line-height: 1.12;
    margin: 0;
    color: var(--ink);
  }

  .hero-sub{
    margin-top: 22px;
    max-width: 46ch;
    font-size: 15px;
    line-height: 1.7;
    color: #55534f;
  }

  /* ---------------------------------- */
  /* INTRO OVERLAY                      */
  /* ---------------------------------- */

  .intro-overlay{
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    visibility: visible;
    /* No-JS fallback: fade the whole overlay out after ~2.8s */
    animation: introFallbackOut 0.5s ease forwards;
    animation-delay: 2.8s;
  }

  @keyframes introFallbackOut{
    to{
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  }

  /* Once JS confirms control, it cancels the fallback animation
     on this element directly (inline style) and drives everything itself. */

  .intro-grid{
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: center;
    opacity: 0;
    transition: opacity 900ms var(--ease-in-out-strong);
  }

  .intro-grid.is-in{
    opacity: 1;
  }

  .intro-vignette{
    position:absolute;
    inset:0;
    background: radial-gradient(circle at center, rgba(255,255,254,0) 0%, rgba(255,255,254,0.55) 72%, rgba(255,255,254,0.92) 100%);
    pointer-events:none;
  }

  #intro-logo{
    position: relative;
    width: min(168px, 34vw);
    height: min(223px, 45.2vw);
    transform-origin: center center;
    will-change: transform;
  }

  .logo-wrap{
    position:absolute;
    inset:0;
  }

  .logo-wrap svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  #lion-wrap{
    clip-path: inset(0 100% 0 0);
    transition: clip-path 1050ms var(--ease-in-out-strong);
  }

  #lion-wrap.is-in{
    clip-path: inset(0 0% 0 0);
  }

  #k-wrap{
    opacity: 0;
    transform: translateX(-12px);
    transition: opacity 760ms var(--ease-out-strong), transform 760ms var(--ease-out-strong);
  }

  #k-wrap.is-in{
    opacity: 1;
    transform: translateX(0);
  }

  .intro-meta{
    position:absolute;
    inset: 0;
    padding: 28px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    pointer-events:none;
    opacity: 0;
    transition: opacity 500ms var(--ease-in-out-strong);
  }

  .intro-meta.is-in{
    opacity: 1;
  }

  .intro-progress{
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    display:flex;
    align-items:baseline;
    gap: 6px;
  }

  .intro-progress .num{
    font-size: 15px;
    font-weight: 600;
  }

  .intro-progress .unit{
    color: #8c897f;
    font-size: 11px;
  }

  .intro-claim{
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--gold);
    text-align: right;
  }

  /* Replay button */
  .replay-btn{
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 1100;
    background: var(--ink);
    color: var(--bg);
    border: none;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    padding: 13px 20px;
    cursor: pointer;
    display:flex;
    align-items:center;
    gap: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 300ms var(--ease-in-out-strong), transform 200ms var(--ease-out-strong);
  }

  .replay-btn.is-visible{
    opacity: 1;
    pointer-events: auto;
  }

  .replay-btn:hover{
    transform: translateY(-1px);
  }

  .replay-btn svg{
    width: 12px;
    height: 12px;
    flex-shrink:0;
  }

  @media (max-width: 480px){
    .site-header{ padding: 0 18px; }
    .site-hero{ padding: 12vh 18px 18vh; }
    .hero-sub{ font-size: 14px; }
    .intro-meta{ padding: 18px; }
    .replay-btn{ right: 16px; bottom: 16px; padding: 11px 16px; font-size: 10px; }
    #intro-logo{ width: min(140px, 38vw); height: min(186px, 50.5vw); }
  }

  /* Reduced motion: skip the intro entirely */
  @media (prefers-reduced-motion: reduce){
    .intro-overlay{ display: none !important; }
    #header-logo-slot svg{ opacity: 1 !important; }
    .replay-btn{ opacity: 0 !important; pointer-events: none !important; }
  }
</style>

<script>
(function(){
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var overlay   = document.getElementById('introOverlay');
  var grid      = document.getElementById('introGrid');
  var lionWrap  = document.getElementById('lion-wrap');
  var kWrap     = document.getElementById('k-wrap');
  var meta      = document.getElementById('introMeta');
  var percentEl = document.getElementById('introPercent');
  var introLogo = document.getElementById('intro-logo');
  var headerSlot= document.getElementById('header-logo-slot');
  var headerSvg = headerSlot.querySelector('svg');
  var replayBtn = document.getElementById('replayBtn');

  if (prefersReduced) {
    overlay.style.display = 'none';
    headerSvg.style.opacity = '1';
    replayBtn.classList.remove('is-visible');
    return;
  }

  // JS is in control: cancel the CSS no-JS fallback animation.
  overlay.style.animation = 'none';

  var timers = [];
  var rafId = null;

  function clearAll(){
    timers.forEach(function(t){ clearTimeout(t); });
    timers = [];
    if (rafId) cancelAnimationFrame(rafId);
  }

  function runTimeline(){
    clearAll();

    // reset state
    overlay.style.visibility = 'visible';
    overlay.style.pointerEvents = 'auto';
    overlay.style.opacity = '1';
    introLogo.style.transition = 'none';
    introLogo.style.transform = 'translate(0px, 0px) scale(1)';
    grid.classList.remove('is-in');
    lionWrap.classList.remove('is-in');
    kWrap.classList.remove('is-in');
    meta.classList.remove('is-in');
    percentEl.textContent = '0';
    headerSvg.style.opacity = '0';
    replayBtn.classList.remove('is-visible');
    // force reflow so the "none" transition + reset actually applies
    // before we re-enable transitions below
    void introLogo.offsetWidth;
    introLogo.style.transition = '';

    // --- Timeline (ms) ---
    var GRID_IN        = 0;
    var REVEAL_START    = 480;
    var K_START          = 620;
    var PERCENT_START    = 480;
    var PERCENT_END      = 1650;
    var META_IN           = 350;
    var FLIP_START        = 1780;
    var FLIP_DUR           = 640;
    var FADE_START        = 1980;
    var FADE_DUR           = 460;
    var CLEANUP            = FLIP_START + FLIP_DUR + 60; // ~2480ms total

    timers.push(setTimeout(function(){ grid.classList.add('is-in'); }, GRID_IN));
    timers.push(setTimeout(function(){ meta.classList.add('is-in'); }, META_IN));
    timers.push(setTimeout(function(){ lionWrap.classList.add('is-in'); }, REVEAL_START));
    timers.push(setTimeout(function(){ kWrap.classList.add('is-in'); }, K_START));

    // percent counter
    timers.push(setTimeout(function(){
      var start = performance.now();
      var span = PERCENT_END - PERCENT_START;
      function tick(now){
        var t = Math.min(1, (now - start) / span);
        var eased = 1 - Math.pow(1 - t, 3);
        percentEl.textContent = Math.round(eased * 100);
        if (t < 1) {
          rafId = requestAnimationFrame(tick);
        } else {
          percentEl.textContent = '100';
        }
      }
      rafId = requestAnimationFrame(tick);
    }, PERCENT_START));

    // FLIP: fly the logo to the header slot
    timers.push(setTimeout(function(){
      var fromRect = introLogo.getBoundingClientRect();
      var toRect = headerSlot.getBoundingClientRect();

      var scale = toRect.width / fromRect.width;
      var fromCenterX = fromRect.left + fromRect.width / 2;
      var fromCenterY = fromRect.top + fromRect.height / 2;
      var toCenterX = toRect.left + toRect.width / 2;
      var toCenterY = toRect.top + toRect.height / 2;

      var dx = toCenterX - fromCenterX;
      var dy = toCenterY - fromCenterY;

      introLogo.style.transition = 'transform ' + FLIP_DUR + 'ms var(--ease-in-out-strong)';
      introLogo.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scale + ')';

      meta.style.transition = 'opacity 320ms var(--ease-in-out-strong)';
      meta.style.opacity = '0';
    }, FLIP_START));

    // Fade the overlay chrome out while the logo is still flying in
    timers.push(setTimeout(function(){
      overlay.style.transition = 'opacity ' + FADE_DUR + 'ms var(--ease-in-out-strong)';
      overlay.style.opacity = '0';
    }, FADE_START));

    // Cleanup: swap in the real header logo, hide overlay
    timers.push(setTimeout(function(){
      headerSvg.style.transition = 'opacity 120ms linear';
      headerSvg.style.opacity = '1';
      overlay.style.visibility = 'hidden';
      overlay.style.pointerEvents = 'none';
      replayBtn.classList.add('is-visible');
    }, CLEANUP));
  }

  runTimeline();

  replayBtn.addEventListener('click', function(){
    overlay.style.transition = 'none';
    void overlay.offsetWidth;
    overlay.style.transition = '';
    runTimeline();
  });
})();
</script>
